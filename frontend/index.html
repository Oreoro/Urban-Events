<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Preconnect to font CDN (saves ~100ms DNS+TLS) -->
      <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />

      <!-- Non-blocking font load (avoids render-blocking CSS) -->
      <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" media="print" onload="this.media='all'" />
      <noscript><link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" /></noscript>

      <!-- App identity -->
      <link rel="icon" href="/manifest-icons/favicon.svg" type="image/svg+xml">
      <link rel="icon" type="image/png" sizes="32x32" href="/manifest-icons/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="/manifest-icons/favicon-16x16.png">
      <link rel="shortcut icon" href="/favicon.ico">

      <!-- Apple Touch Icon -->
      <link rel="apple-touch-icon" sizes="180x180" href="/manifest-icons/apple-touch-icon.png">

      <!-- Manifest -->
      <link rel="manifest" href="/site.webmanifest">

      <!-- Installed app -->
      <meta name="application-name" content="Urban Events">
      <meta name="apple-mobile-web-app-title" content="Urban Events">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <meta name="theme-color" content="#171717">
      <meta name="msapplication-TileColor" content="#171717">

    <!--render-helmet--><title>Urban Events</title><!--/render-helmet-->
    <!--environment-variables-->
    <!--head-snippets-->

    <!-- Critical inline CSS: dark background prevents white flash during SSR hydration -->
    <style>
      html, body { margin: 0; padding: 0; background: #171717; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry.client.tsx"></script>
    <!--dehydrated-state-->
  </body>
</html>

# .github/workflows/azure-deploy.yml
name: Build and Deploy to Azure Web App

# This workflow runs on pushes to the development branch or can be triggered manually.
on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      # Authenticate to your Azure account using a service principal.
      - name: 'Log in to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Authenticate to the Azure Container Registry.
      - name: 'Log in to Azure Container Registry'
        run: az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      # Build and push the Docker image to ACR.
      - name: 'Build and Push Docker image'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          echo "Building and pushing Docker image..."
          # Build the Docker image. The compose service tags it as urban-events:v1.
          docker compose -f ${{ github.workspace }}/docker/all-in-one/docker-compose.yml build
          
          # Tag the locally built image with the full ACR registry path.
          docker tag urban-events:v1 ${{ secrets.ACR_LOGIN_SERVER }}/urban-events:v1
          
          # Push the newly tagged image to ACR.
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/urban-events:v1
          echo "✅ Docker image built and pushed."

      # Upload application settings to the Azure Web App.
      - name: 'Set App Service Settings'
        uses: azure/CLI@v1
        with:
          inlineScript: |
            echo "Setting Azure App Service application settings..."

            # Check if the secret is not empty before attempting to set app settings.
            if [ -n "${{ secrets.AZURE_APP_SECRETS }}" ]; then
              # The az command correctly handles multiline secrets, so we pass the secret directly.
              az webapp config appsettings set \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --name ${{ secrets.AZURE_WEBAPP_NAME }} \
                --settings ${{ secrets.AZURE_APP_SECRETS }}
            else
              echo "⚠️ AZURE_APP_SECRETS is empty. Skipping application settings update."
            fi
            
            echo "✅ Application settings configured."

      # Deploy the new Docker image to the Azure Web App.
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          # This image name MUST match the one pushed in the previous step.
          images: '${{ secrets.ACR_LOGIN_SERVER }}/urban-events:v1'

      # Log out of Azure as a security best practice.
      - name: 'Log out of Azure'
        if: always()
        run: |
          az logout
          az cache purge
          az account clear

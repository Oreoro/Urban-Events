; PHP-FPM pool configuration for Urban Events
; Tuned for Cloudflare Container standard-1 instance (~1GB RAM)
; 8 PHP workers × ~32MB each = ~256MB (leaves headroom for Node.js + Redis)

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.backlog = 511

; Process manager — static for consistent latency (no spawn delay)
pm = static
pm.max_children = 8
pm.start_servers = 8
pm.min_spare_servers = 8
pm.max_spare_servers = 8

; Kill workers after 1000 requests to prevent memory leaks
pm.max_requests = 1000

; Timeouts
request_terminate_timeout = 30s
request_slowlog_timeout = 5s

; Logging
slowlog = /dev/stderr
access.log = /dev/stdout
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Status page for monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Security
security.limit_extensions = .php

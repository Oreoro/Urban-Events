; PHP-FPM pool configuration for Urban Events
; Tuned for Cloudflare Container standard-1 instance (~1GB RAM)
; 10 PHP workers × ~40MB each = ~400MB (leaves headroom for Node.js + Redis)

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.backlog = 1023

; Process manager — static for consistent latency (no spawn delay)
pm = static
pm.max_children = 10
pm.start_servers = 10
pm.min_spare_servers = 10
pm.max_spare_servers = 10

; Kill workers after 2000 requests to prevent memory leaks
pm.max_requests = 2000

; Timeouts — tighter for faster failure recovery
request_terminate_timeout = 20s
request_slowlog_timeout = 5s

; Logging
slowlog = /dev/stderr
access.log = /dev/stdout
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Status page for monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Security
security.limit_extensions = .php

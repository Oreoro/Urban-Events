; PHP-FPM pool configuration for Urban Events
; Tuned for Cloudflare Container basic instance (~512MB RAM)
; 5 PHP workers × ~32MB each = ~160MB (leaves headroom for Node.js + Redis)

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Process manager — static for consistent latency (no spawn delay)
pm = static
pm.max_children = 5
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 5

; Kill workers after 500 requests to prevent memory leaks
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 60s
request_slowlog_timeout = 5s

; Logging
slowlog = /dev/stderr
access.log = /dev/stdout
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Status page for monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

; PHP runtime performance tuning
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 20M
upload_max_filesize = 20M

; Realpath cache — faster file stat calls for autoloaded classes
realpath_cache_size = 4096K
realpath_cache_ttl = 1200

; Output buffering
output_buffering = 8192
zlib.output_compression = On
zlib.output_compression_level = 6

; Session
session.use_strict_mode = 1

; Disable expose_php for security
expose_php = Off

; Fast CGI status for monitoring
pm.status_path = /fpm-status

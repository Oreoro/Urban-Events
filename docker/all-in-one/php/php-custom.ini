; PHP runtime performance tuning
memory_limit = 128M
max_execution_time = 60
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; Realpath cache — faster file stat calls for autoloaded classes
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Output buffering
output_buffering = 4096
zlib.output_compression = On
zlib.output_compression_level = 5

; Session
session.use_strict_mode = 1

; Expose PHP status endpoint for monitoring
expose_php = Off

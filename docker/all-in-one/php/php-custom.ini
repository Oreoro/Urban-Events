; PHP runtime performance tuning — maximum performance
memory_limit = 256M
max_execution_time = 20
max_input_time = 15
post_max_size = 20M
upload_max_filesize = 20M

; Realpath cache — larger for faster file stat calls
realpath_cache_size = 8192K
realpath_cache_ttl = 1200

; Output buffering — larger for better compression
output_buffering = 16384
zlib.output_compression = On
zlib.output_compression_level = 6

; Session
session.use_strict_mode = 1

; Disable expose_php for security
expose_php = Off

; Fast CGI status for monitoring
pm.status_path = /fpm-status

; Exception handling — faster error reporting
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Disable unnecessary functions for performance
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; Fast CGI status for monitoring
pm.status_path = /fpm-status

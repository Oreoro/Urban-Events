events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        charset utf-8;

        access_log /dev/stdout;
        error_log /dev/stderr;

        # All requests for /api are routed to the Laravel backend
        location /api {
            alias /app/backend/public;
            try_files $uri $uri/ @backend;
        }

        # The rest of the requests are routed to the React frontend
        location / {
            root /app/frontend; # Use the correct path for the frontend assets
            try_files $uri $uri/ /index.html;
        }

        # This named location handles all PHP requests for the backend API
        location @backend {
            root /app/backend/public;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        # Deny access to hidden files
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

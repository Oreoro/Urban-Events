worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # --- Core performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    reset_timedout_connection on;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;

    # --- Gzip compression (higher level, smaller output) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 7;
    gzip_min_length 100;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon
        image/webp
        application/wasm;

    # --- Open file cache (reduces disk stat calls) ---
    open_file_cache max=5000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- FastCGI cache for API responses ---
    fastcgi_cache_path /tmp/nginx-fcgi-cache
        levels=1:2
        keys_zone=API_CACHE:32m
        max_size=128m
        inactive=10m
        use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 3s;
    fastcgi_cache_background_update on;
    fastcgi_cache_revalidate on;

    # --- Logging (disable access log for static files to reduce I/O) ---
    access_log /dev/stdout combined buffer=16k flush=5s;
    error_log /dev/stderr warn;
    log_not_found off;

    # --- MIME ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /app/backend/public;

        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        index index.html index.htm index.php;
        charset utf-8;

        # --- Static file serving: S3-linked storage ---
        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires 365d;
            add_header Cache-Control "public, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        # --- Frontend assets (Vite bundled) - with aggressive caching ---
        location ^~ /assets/ {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            access_log off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        # --- Backend API (PHP-FPM) - optimized for speed ---
        location ^~ /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass 127.0.0.1:9000;
            client_max_body_size 20M;

            # FastCGI cache for API responses
            set $skip_cache 0;
            # Skip cache for mutations
            if ($request_method !~ ^(GET|HEAD)$) {
                set $skip_cache 1;
            }
            # Skip cache for auth, webhooks, and dynamic endpoints
            if ($request_uri ~* "/auth/|/webhook|/checkout|/payment|/admin/|/orders/") {
                set $skip_cache 1;
            }
            # Skip cache if user is authenticated (Authorization header present)
            if ($http_authorization) {
                set $skip_cache 1;
            }
            fastcgi_cache API_CACHE;
            fastcgi_cache_valid 200 5m;
            fastcgi_cache_valid 301 302 1m;
            fastcgi_cache_valid 404 30s;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;
            add_header X-Cache-Status $upstream_cache_status always;

            # FastCGI tuning - faster timeouts
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 16k;
            fastcgi_connect_timeout 2s;
            fastcgi_send_timeout 15s;
            fastcgi_read_timeout 15s;
        }

        # --- Health check ---
        location = /healthz {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO /health;
            fastcgi_param REQUEST_URI /health;
            fastcgi_pass 127.0.0.1:9000;
            access_log off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            fastcgi_read_timeout 5s;
        }

        # --- Catch-all PHP ---
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param PHP_VALUE "error_log=/dev/stderr";
            fastcgi_connect_timeout 2s;
            fastcgi_send_timeout 15s;
            fastcgi_read_timeout 15s;
        }

        # --- Frontend SSR (Node.js) - optimized for speed ---
        location / {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # --- Favicon / robots ---
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            expires 365d;
            add_header Cache-Control "public, immutable" always;
        }
        location = /robots.txt  {
            access_log off;
            log_not_found off;
            expires 1d;
        }

        # --- Block dotfiles ---
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

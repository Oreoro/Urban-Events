worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # --- Core performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;

    # --- Open file cache (reduces disk stat calls) ---
    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- FastCGI cache for API responses ---
    fastcgi_cache_path /tmp/nginx-fcgi-cache
        levels=1:2
        keys_zone=API_CACHE:16m
        max_size=64m
        inactive=5m
        use_temp_path=off;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 5s;

    # --- Logging ---
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # --- MIME ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /app/backend/public;

        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff" always;

        index index.html index.htm index.php;
        charset utf-8;

        # --- Static file serving: S3-linked storage ---
        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # --- Frontend assets (Vite bundled) ---
        location ^~ /assets/ {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # --- Backend API (PHP-FPM) ---
        location ^~ /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass 127.0.0.1:9000;
            client_max_body_size 20M;

            # FastCGI cache for API responses (skip for auth/mutations)
            set $skip_cache 0;
            if ($request_method !~ ^(GET|HEAD)$) {
                set $skip_cache 1;
            }
            if ($request_uri ~* "/auth/|/webhook|/checkout|/payment") {
                set $skip_cache 1;
            }
            fastcgi_cache API_CACHE;
            fastcgi_cache_valid 200 2m;
            fastcgi_cache_valid 404 1m;
            fastcgi_cache_bypass $skip_cache;
            fastcgi_no_cache $skip_cache;
            add_header X-Cache-Status $upstream_cache_status;

            # FastCGI tuning
            fastcgi_buffer_size 16k;
            fastcgi_buffers 4 16k;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 30s;
            fastcgi_read_timeout 30s;
        }

        # --- Health check ---
        location = /healthz {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO /health;
            fastcgi_param REQUEST_URI /health;
            fastcgi_pass 127.0.0.1:9000;
            access_log off;
        }

        # --- Catch-all PHP ---
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param PHP_VALUE "error_log=/dev/stderr";
        }

        # --- Frontend SSR (Node.js) ---
        location / {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy buffering for SSR responses
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        # --- Favicon / robots ---
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # --- Block dotfiles ---
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

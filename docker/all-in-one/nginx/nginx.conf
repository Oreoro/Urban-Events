events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /app/backend/public; # Set for the PHP-FPM part.

        # Route API requests to the Laravel backend.
        location /api {
            try_files $uri /index.php?$query_string;
        }

        # Route all other requests to the React frontend server.
        location / {
            proxy_pass http://localhost:5678; # Match the port from supervisord
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # This block executes the PHP script for the /api location.
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass localhost:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Deny access to hidden files.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}

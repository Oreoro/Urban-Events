# /etc/nginx/nginx.conf

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include "/etc/nginx/modules-enabled/*.conf";

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging to container's stdout/stderr for easy debugging
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        server_name _;

        # --- FRONTEND CONFIGURATION ---
        # Set the root to your frontend's build output directory.
        # This MUST match the output folder from 'yarn build'. Common names are 'dist' or 'build'.
        root /app/frontend/dist; 
        index index.html index.htm;

        # This block serves your Single-Page App. 
        # It tries to find a static file and if it can't, it serves index.html
        # so your frontend router can handle the URL.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- BACKEND & API CONFIGURATION ---

        # This block handles Laravel's public storage link
        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # This block proxies all API requests to your PHP-FPM service.
        location ~ ^/api(/.*)$ {
            # This should match the port your PHP-FPM service is listening on.
            # Your php-fpm config doesn't specify a port, so it uses the default socket.
            # However, your original nginx config used localhost:9000, which is a common setup.
            # We will assume php-fpm is configured to listen on port 9000.
            fastcgi_pass localhost:9000; 
            fastcgi_index index.php;
            include fastcgi_params;
            # This tells PHP where your backend's entry point is.
            fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # --- SECURITY & OTHER SETTINGS ---

        # Deny access to dotfiles (.htaccess, .git, etc.)
        location ~ /\. {
            deny all;
        }

        # This handles any direct requests to .php files, which shouldn't happen
        # in a well-configured app but is good to have as a fallback.
        location ~ \.php$ {
            return 404;
        }
    }
}

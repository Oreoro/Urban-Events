events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /app/backend/public;
        index index.php index.html index.htm;

        charset utf-8;
        add_header X-XSS-Protection "1; mode=block";

        # Logging (good for containers)
        access_log /dev/stdout;
        error_log /dev/stderr;

        # Location for publicly accessible storage files (e.g., user uploads)
        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # Main location to handle all requests
        location / {
            # Try to serve the requested file directly, otherwise fall back to index.php
            try_files $uri $uri/ /index.php?$query_string;
        }

        # The single location block to process all PHP requests
        location ~ \.php$ {
            # This try_files is a security measure to prevent arbitrary script execution
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass localhost:9000; # Or your PHP-FPM container name, e.g., php-fpm:9000
            fastcgi_index index.php;

            # This passes the correct script name to PHP-FPM
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE "error_log=/dev/stderr";
            client_max_body_size 20M;
        }

        # Deny access to hidden files like .htaccess
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Standard rules for favicon and robots.txt
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;
    }
}

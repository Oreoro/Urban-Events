events {}

http {
   server {
       listen 80;
       listen [::]:80;
       server_name _;

       root /app/backend/public;

       add_header X-XSS-Protection "1; mode=block";

       index index.html index.htm index.php;
       charset utf-8;

       access_log /dev/stdout;
       error_log /dev/stderr;

       # Let Nginx compress proxied responses from the Node.js SSR server
       gzip on;
       gzip_types text/plain text/css application/json application/javascript text/xml;

        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        location ^~ /assets/ {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Backend API — rewrite /api/<path> → /index.php/<path> and proxy to
        # PHP-FPM.  The captured group $1 is the path *after* /api/, which
        # is what Laravel's router expects because api.php routes are
        # registered without an /api prefix.
        location ^~ /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass localhost:9000;
            client_max_body_size 20M;
        }

        # Health check — the Cloudflare Container SDK polls this endpoint to
        # decide whether the container is ready.  We deliberately hit the
        # Node.js server so the check confirms *both* backends are live.
        location = /healthz {
            proxy_pass http://localhost:5678/robots.txt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

       # Catch-all PHP handler (legacy routes, debug pages, etc.)
       location ~ \.php$ {
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_split_path_info ^(.+\.php)(/.+)$;
           fastcgi_pass localhost:9000;
           fastcgi_index index.php;
           fastcgi_param PHP_VALUE "error_log=/dev/stderr";
       }

       # Frontend SSR server (React/Vite)
       location / {
           proxy_pass http://localhost:5678;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }

       location = /favicon.ico { access_log off; log_not_found off; }
       location = /robots.txt  { access_log off; log_not_found off; }

       location ~ /\.(?!well-known).* {
           deny all;
       }
   }
}

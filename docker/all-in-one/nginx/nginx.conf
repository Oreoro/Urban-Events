events {}

http {
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /app/backend/public;
        index index.php index.html;

        charset utf-8;
        add_header X-XSS-Protection "1; mode=block";

        # Logging to stdout/stderr for container environments
        access_log /dev/stdout;
        error_log /dev/stderr;

        # Location for publicly accessible storage files (if using local 'public' disk)
        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # Main location block to handle all requests
        # Tries to serve a static file first, otherwise passes to Laravel
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # The single location block to process all PHP requests
        location ~ \.php$ {
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass localhost:9000; # Connect to the PHP-FPM service
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Deny access to hidden files like .htaccess
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Standard rules for favicon and robots.txt
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}

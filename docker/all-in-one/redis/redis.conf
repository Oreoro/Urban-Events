# Redis configuration optimized for Urban Events container
# Runs inside container on localhost only

# Network
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 60
timeout 0

# Memory
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence - disabled for speed (cache-only, no durability needed)
save ""
appendonly no

# Performance
hz 10
dynamic-hz yes
no-appendfsync-on-rewrite yes

# Lazy freeing - reduces latency on evictions
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# LRU sampling
maxmemory-samples 10

# Logging
loglevel warning
logfile ""

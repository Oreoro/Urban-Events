services:
  hi-events-backend:
    build:
      context: ./../../backend
      dockerfile: Dockerfile
    container_name: hi-events-backend
    ports:
      - "8124:80"
    environment:
      APP_NAME: "${APP_NAME:-Urban Events}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_LOG_QUERIES: "${APP_LOG_QUERIES:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_PORT: "${APP_PORT:-80}"
      APP_FRONTEND_URL: "${APP_FRONTEND_URL:-https://localhost:8443}"
      APP_CDN_URL: "${APP_CDN_URL:-null}"
      APP_SAAS_MODE_ENABLED: "${APP_SAAS_MODE_ENABLED:-false}"
      APP_HOMEPAGE_VIEWS_UPDATE_BATCH_SIZE: "${APP_HOMEPAGE_VIEWS_UPDATE_BATCH_SIZE:-8}"
      APP_DISABLE_REGISTRATION: "${APP_DISABLE_REGISTRATION:-false}"
      APP_STRIPE_CONNECT_ACCOUNT_TYPE: "${APP_STRIPE_CONNECT_ACCOUNT_TYPE:-express}"
      APP_PLATFORM_SUPPORT_EMAIL: "${APP_PLATFORM_SUPPORT_EMAIL:-support@urbanevents.pk}"
      
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"

      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"

      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-backend}"
      DB_USERNAME: "${DB_USERNAME:-username}"
      DB_PASSWORD: "${DB_PASSWORD:-password}"

      BROADCAST_DRIVER: "${BROADCAST_DRIVER:-log}"
      CACHE_DRIVER: "${CACHE_DRIVER:-file}"
      FILESYSTEM_PUBLIC_DISK: "${FILESYSTEM_PUBLIC_DISK:-azure}"
      FILESYSTEM_PRIVATE_DISK: "${FILESYSTEM_PRIVATE_DISK:-azure}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_QUEUE: "${REDIS_QUEUE:-default}"
      REDIS_URL: "${REDIS_URL:-}"
      REDIS_USERNAME: "${REDIS_USERNAME:-default}"
      REDIS_SCHEME: "${REDIS_SCHEME:-tcp}"

      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-mailpit}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_USERNAME: "${MAIL_USERNAME:-null}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-null}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Urban Events}"

      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ALGO: "${JWT_ALGO:-HS256}"

      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-}"
      AZURE_STORAGE_CONTAINER: "${AZURE_STORAGE_CONTAINER:-urbanevents}"
      AZURE_STORAGE_URL: "${AZURE_STORAGE_URL:-}"
      
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-west-1}"
      AWS_PUBLIC_BUCKET: "${AWS_PUBLIC_BUCKET:-}"
      AWS_PRIVATE_BUCKET: "${AWS_PRIVATE_BUCKET:-}"

      STRIPE_PUBLIC_KEY: "${STRIPE_PUBLIC_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
